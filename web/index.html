<script>
// NOAA solar position algorithm (shared by index.html; also loadable in node for tests)
(function (root) {
  const rad = Math.PI / 180, deg = 180 / Math.PI;

  function core(ms) {
    const jd = ms / 86400000 + 2440587.5;
    const T = (jd - 2451545) / 36525;
    const L0 = ((280.46646 + T * (36000.76983 + T * 0.0003032)) % 360 + 360) % 360;
    const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
    const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
    const C = Math.sin(M * rad) * (1.914602 - T * (0.004817 + 0.000014 * T)) +
      Math.sin(2 * M * rad) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * rad) * 0.000289;
    const trueLong = L0 + C;
    const omega = 125.04 - 1934.136 * T;
    const appLong = trueLong - 0.00569 - 0.00478 * Math.sin(omega * rad);
    const meanObliq = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
    const obliq = meanObliq + 0.00256 * Math.cos(omega * rad);
    const decl = Math.asin(Math.sin(obliq * rad) * Math.sin(appLong * rad)) * deg;
    const y = Math.pow(Math.tan(obliq * rad / 2), 2);
    const eqTime = 4 * deg * (y * Math.sin(2 * L0 * rad) - 2 * e * Math.sin(M * rad) +
      4 * e * y * Math.sin(M * rad) * Math.cos(2 * L0 * rad) -
      0.5 * y * y * Math.sin(4 * L0 * rad) - 1.25 * e * e * Math.sin(2 * M * rad));
    return { decl, eqTime };
  }

  // altitude/azimuth in degrees (azimuth from north, clockwise)
  function position(ms, lat, lon) {
    const { decl, eqTime } = core(ms);
    const d = new Date(ms);
    const utcMin = d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60 + d.getUTCMilliseconds() / 60000;
    let tst = ((utcMin + eqTime + 4 * lon) % 1440 + 1440) % 1440;
    const ha = tst / 4 < 0 ? tst / 4 + 180 : tst / 4 - 180;
    const cosZ = Math.sin(lat * rad) * Math.sin(decl * rad) + Math.cos(lat * rad) * Math.cos(decl * rad) * Math.cos(ha * rad);
    const zen = Math.acos(Math.max(-1, Math.min(1, cosZ))) * deg;
    let alt = 90 - zen;
    // atmospheric refraction (NOAA approximation)
    if (alt > -0.575) {
      const te = Math.tan(alt * rad);
      let r;
      if (alt > 85) r = 0;
      else if (alt > 5) r = 58.1 / te - 0.07 / (te * te * te) + 0.000086 / Math.pow(te, 5);
      else r = 1735 + alt * (-518.2 + alt * (103.4 + alt * (-12.79 + alt * 0.711)));
      alt += r / 3600;
    } else {
      alt += (-20.774 / Math.tan(alt * rad)) / 3600;
    }
    const az = (Math.atan2(Math.sin(ha * rad),
      Math.cos(ha * rad) * Math.sin(lat * rad) - Math.tan(decl * rad) * Math.cos(lat * rad)) * deg + 180 + 360) % 360;
    return { altitude: alt, azimuth: az, declination: decl };
  }

  // Sunrise/sunset (epoch ms) for the UTC day containing `dayMs` local noon.
  // Returns {sunrise, sunset, noon, polar: null|'day'|'night'}
  function times(dayMs, lat, lon, zenithDeg) {
    zenithDeg = zenithDeg || 90.833;
    // local calendar date -> approximate solar noon epoch
    const ld = new Date(dayMs);
    const dayStartUTC = Date.UTC(ld.getFullYear(), ld.getMonth(), ld.getDate());
    function event(sign) {
      // iterate twice for accuracy
      let guess = dayStartUTC + 12 * 3600000 - lon * 4 * 60000;
      let result = null, polar = null;
      for (let i = 0; i < 3; i++) {
        const { decl, eqTime } = core(guess);
        const noonMin = 720 - 4 * lon - eqTime;
        const arg = Math.cos(zenithDeg * rad) / (Math.cos(lat * rad) * Math.cos(decl * rad)) - Math.tan(lat * rad) * Math.tan(decl * rad);
        if (sign === 0) { result = dayStartUTC + noonMin * 60000; guess = result; continue; }
        if (arg > 1) { polar = 'night'; result = null; break; }
        if (arg < -1) { polar = 'day'; result = null; break; }
        const haS = Math.acos(arg) * deg;
        result = dayStartUTC + (noonMin + sign * 4 * haS) * 60000;
        guess = result;
      }
      return { t: result, polar };
    }
    const r = event(-1), s = event(1), n = event(0);
    // local date boundary: the noon estimate is anchored on the UTC date of the local date;
    // for far east/west longitudes, shift by a day so noon lands on the local date.
    let shift = 0;
    const localNoonDate = new Date(n.t);
    if (localNoonDate.getDate() !== ld.getDate()) shift = (localNoonDate < ld ? 1 : -1) * 86400000;
    const add = (v) => v == null ? null : v + shift;
    return { sunrise: add(r.t), sunset: add(s.t), noon: add(n.t), polar: r.polar || s.polar };
  }

  const api = { position, times };
  if (typeof module !== 'undefined') module.exports = api; else root.SunMath = api;
})(this);

</script>
<script>
(function () {
'use strict';
const qs = new URLSearchParams(location.search);
const num = (k, d) => (qs.has(k) && !isNaN(parseFloat(qs.get(k)))) ? parseFloat(qs.get(k)) : d;

const cfg = {
  lat: num('lat', 48.137), lon: num('lon', 11.575),
  scene: qs.get('scene') || 'blinds',
  decoration: qs.get('deco') || 'foliage',
  wall: qs.get('wall') || 'knockdown',
  dynamic: qs.get('dyn') !== '0',
  timeOverride: qs.has('t') ? new Date(qs.get('t')).getTime() : null,
  speed: num('speed', 1),
  showHUD: qs.get('hud') === '1',
  lowPower: qs.get('lowpower') === '1',
  paused: false,            // set by the app when the desktop is covered or the displays sleep
};
const SCENES = ['blinds', 'window', 'arch'];
const DECOS = ['none', 'foliage', 'curtain'];
const WALLS = ['knockdown', 'limewash', 'wood'];
function normalize() {
  if (cfg.scene === 'leaves') { cfg.scene = 'window'; cfg.decoration = 'foliage'; } // legacy
  if (!SCENES.includes(cfg.scene)) cfg.scene = 'blinds';
  if (cfg.decoration === 'glass' || cfg.decoration === 'prism') cfg.decoration = 'none';   // removed options
  if (cfg.decoration === 'monstera') cfg.decoration = 'foliage';          // removed option
  if (!DECOS.includes(cfg.decoration)) cfg.decoration = 'foliage';
  if (!WALLS.includes(cfg.wall)) cfg.wall = 'knockdown';                 // plaster/brick/linen/concrete → knockdown
  cfg.dynamic = !!cfg.dynamic;
}
normalize();
let clockBase = { real: Date.now(), sim: cfg.timeOverride != null ? cfg.timeOverride : Date.now() };
function simNow() {
  if (cfg.timeOverride == null && cfg.speed === 1) return Date.now();
  return clockBase.sim + (Date.now() - clockBase.real) * cfg.speed;
}
function rebase(simMs) { clockBase = { real: Date.now(), sim: simMs }; }

// ---------- sun state ----------
let dayCache = { key: '', t: null };
function dayTimes(ms) {
  const d = new Date(ms);
  const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '|' + cfg.lat + ',' + cfg.lon;
  if (dayCache.key !== key) dayCache = { key, t: SunMath.times(ms, cfg.lat, cfg.lon) };
  return dayCache.t;
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// gentle wind for the dynamic environment: slow 1D value noise over real time
const h1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function gust() {  // 0..0.6, rising and falling every ~10-20 s
  if (!cfg.dynamic) return 0;
  const x = performance.now() / 1000 / 7 + 50, i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const n = h1(i * 3.1) * (1 - u) + h1(i * 3.1 + 3.1) * u;
  return 0.6 * smooth(0.3, 0.9, n);
}
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
function ramp(stops, x) {
  if (x <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (x <= stops[i][0]) {
    const t = (x - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
    const s = t * t * (3 - 2 * t);
    return mix3(stops[i - 1][1], stops[i][1], s);
  }
  return stops[stops.length - 1][1];
}
const SUN_COL = [[-1, [1.0, 0.24, 0.05]], [1, [1.0, 0.33, 0.09]], [4, [1.0, 0.47, 0.18]], [9, [1.0, 0.62, 0.34]],
  [18, [1.0, 0.78, 0.56]], [30, [1.0, 0.89, 0.74]], [50, [1.0, 0.95, 0.87]]];
const AMB_COL = [[-18, [0.007, 0.010, 0.024]], [-12, [0.013, 0.019, 0.045]], [-6, [0.040, 0.058, 0.125]],
  [-2, [0.10, 0.115, 0.20]], [2, [0.20, 0.18, 0.21]], [10, [0.28, 0.265, 0.255]], [40, [0.33, 0.325, 0.32]]];

function sunState(ms) {
  const pos = SunMath.position(ms, cfg.lat, cfg.lon);
  const dt = dayTimes(ms);
  let p; // progress through daylight 0..1
  if (dt.sunrise != null && dt.sunset != null) p = (ms - dt.sunrise) / (dt.sunset - dt.sunrise);
  else { const d = new Date(ms); p = (d.getHours() * 60 + d.getMinutes()) / 1440; }
  p = clamp(p, -0.05, 1.05);
  const alt = pos.altitude;
  // virtual sun direction in room space: light moves right->left through the day
  const rel = (0.5 - p) * 0.9;               // radians, ~±30°
  const altE = (Math.max(alt, 0) * 0.36 + 3.0) * Math.PI / 180;
  const s = [Math.sin(rel) * Math.cos(altE), Math.sin(altE), Math.cos(rel) * Math.cos(altE)];
  let sunI = smooth(-1.2, 3.5, alt) * (1.05 + 0.6 * smooth(0, 25, alt));
  let sunCol = ramp(SUN_COL, alt);
  let amb = ramp(AMB_COL, alt);
  // ---- night: moonlight takes over as the key light ----
  const night = 1 - smooth(-12, -2, alt);              // 0 in daylight/early twilight, 1 in full night
  // the moon is a fixed key light for the whole night: same place, same strength, every night
  const moonI = 0.11 * night;
  const mrel = -0.22;                                   // slightly from the left
  const maltE = (35 * 0.36 + 3.0) * Math.PI / 180;      // as if ~35 deg up
  const ms_ = [Math.sin(mrel) * Math.cos(maltE), Math.sin(maltE), Math.cos(mrel) * Math.cos(maltE)];
  const moonCol = [0.66, 0.78, 1.0];
  // sunI reaches 0 at -1.2 deg; moonI is still 0 there (night factor), so the hand-over is seamless
  const keyIsSun = sunI > 0.0005 || moonI < 0.0005;
  // very faint distant street lamp as a warm accent against the blue
  const nightI = night * 0.012;
  return {
    pos, dt, p, sunI, sunCol, amb, nightI, night,
    s: keyIsSun ? s : ms_, keyI: keyIsSun ? sunI : moonI, keyCol: keyIsSun ? sunCol : moonCol,
  };
}

// ---------- WebGL ----------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'low-power' });
// GPU reset / driver update: the context is gone for good, so start over. The shell re-sends the
// config (and pause state) when the reloaded page posts "ready".
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); setTimeout(() => location.reload(), 500); });

const VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }';
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec3 uSun; uniform vec3 uSunCol; uniform vec3 uAmb;
uniform float uSunI; uniform float uScene; uniform float uNight; uniform float uWall;
uniform float uAnim; uniform float uDyn; uniform float uDeco; uniform float uGust; uniform float uNightGrade;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=.5; } return v; }
float fbm3(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<3;i++){ v+=a*noise(p); p=m*p; a*=.5; } return v; }

float box(vec2 q, vec2 h, float w){ return smoothstep(-w,w,h.x-abs(q.x))*smoothstep(-w,w,h.y-abs(q.y)); }
float bar(float x, float half_, float w){ return smoothstep(-w, w, abs(x) - half_); } // 1 outside bar

vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+17.31)); }
`;
const WALL_FS = COMMON + `// ---- walls: relief height and albedo ----
// 0 knockdown, 1 limewash, 2 oak panels.
// The wall is seen from across the room: one screen height is roughly 2.5 m of wall,
// so texture features are small and only really show in low, raking light.
// oak veneer panels: full-height ~32 cm panels separated by thin dark reveals.
// returns x = position across the panel (-0.5..0.5), y = panel id, z = distance to the reveal (wall units)
const float PANEL = 0.13;
vec3 oakPanel(vec2 p){
  float id = floor(p.x/PANEL), f = fract(p.x/PANEL);
  return vec3(f - 0.5, id, min(f, 1. - f)*PANEL);
}
// limewash brush strokes: coats laid on in loose criss-cross passes
float limeStrokes(vec2 p){
  // warp the stroke field so marks curve like a wrist-swept brush, then break them into short dabs
  vec2 wp = p + (vec2(fbm3(p*3. + 1.), fbm3(p*3. + 8.)) - 0.5)*0.18;
  vec2 d1 = vec2(0.80*wp.x + 0.60*wp.y, -0.60*wp.x + 0.80*wp.y);
  vec2 d2 = vec2(0.77*wp.x - 0.64*wp.y, 0.64*wp.x + 0.77*wp.y);
  float a = noise(vec2(d1.x*9., d1.y*40.) + 7.) * smoothstep(0.35, 0.75, noise(d1*vec2(5., 2.) + 2.));
  float b = noise(vec2(d2.x*9., d2.y*36.) + 3.) * smoothstep(0.35, 0.75, noise(d2*vec2(5., 2.) + 9.));
  return max(a, b);
}
float wallHeight(vec2 p){
  if (uWall < 0.5) {
    // knockdown: splattered mud flattened by a trowel = flat-topped islands with soft shoulders
    vec2 x = p*151.;
    float n = fbm3(x + 3.) + 0.22*noise(x*2.7 + 9.);
    float islands = smoothstep(0.50, 0.60, n);
    float small = smoothstep(0.62, 0.70, noise(x*2.2 + 17.));
    return islands*0.75 + small*0.25 + noise(p*1100.)*0.05;     // + fine sand in the paint
  }
  if (uWall < 1.5) return limeStrokes(p)*0.6 + fbm3(p*9. + 4.)*0.3 + noise(p*260.)*0.12;   // brush ridges, chalky grit
  // oak panels: smooth veneer faces, crisp square reveals between them
  vec3 b = oakPanel(p);
  return 0.15 + 0.85*smoothstep(0.0012, 0.0024, b.z);
}
vec3 wallAlbedo(vec2 p, float h){
  if (uWall < 0.5) {          // knockdown: one coat of warm white paint, tiny AO in the valleys
    return vec3(0.90, 0.86, 0.79) * (0.965 + 0.025*h + 0.02*fbm3(p*5. + 3.));
  }
  if (uWall < 1.5) {          // limewash: translucent mineral coats -> cloudy, uneven, visibly brushed tone
    float big = fbm(p*2.4 + 5.);                  // broad clouds where coats overlap (~1 m)
    float mid = fbm3(p*7. + 2.);                  // patchy mottling (~30 cm)
    float st = limeStrokes(p);                    // the brush marks themselves
    float tone = clamp(0.5 + 1.25*(big - 0.5) + 0.75*(mid - 0.5) + 0.22*(st - 0.3), 0., 1.);
    // darker patches are warmer and a little deeper, like pigment pooling in a real lime coat
    return mix(vec3(0.70, 0.61, 0.51), vec3(0.93, 0.89, 0.82), smoothstep(0.1, 0.9, tone));
  }
  // crown-cut oak veneer in a warm honey tone: fine, wavy lengthwise grain with the odd soft flame,
  // each panel a slightly different leaf; thin dark reveals between panels
  vec3 b = oakPanel(p);
  float hb = hash(vec2(b.y, 3.1));
  float xl = b.x*PANEL;
  float yy = p.y + hb*7.;
  float warp = (fbm3(vec2(xl*22., yy*2.6) + hb*11.) - 0.5)*0.022;          // grain wanders and waves
  float lines = 0.5 + 0.5*sin((xl + warp)*1150.);
  float streak = fbm3(vec2((xl + warp)*70., yy*0.9) + hb*5.);               // broader light/dark figure
  float flame = smoothstep(0.62, 0.9, sin((yy*0.5 + 30.*(xl - (hb - 0.5)*0.05)*(xl - (hb - 0.5)*0.05))*120.)*0.5 + 0.5)
              * smoothstep(0.35, 0.0, abs(b.x));                          // soft cathedral flame near the middle
  vec3 oak = mix(vec3(0.80, 0.53, 0.30), vec3(0.88, 0.62, 0.37), hb);
  vec3 c = oak * (0.92 + 0.08*lines + 0.16*(streak - 0.5) - 0.07*flame);
  float reveal = smoothstep(0.0012, 0.0024, b.z);
  return c * mix(0.18, 1., reveal);
}


// pass 1: wall albedo + relief height, rendered once per wall/size change
void main(){
  vec2 p = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  float h = wallHeight(p);
  gl_FragColor = vec4(wallAlbedo(p, h), clamp(h*0.4 + 0.5, 0., 1.));
}`;
const LIGHT_FS = COMMON + `mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }

// ---- tree outside: near leaf sprays on twigs, mid clumps, far canopy with pinhole sun flecks ----
float leaflet(vec2 p, float L, float W, float w, float shape, float bend){
  p.y -= bend*p.x*p.x/L;                         // leaves curl slightly
  float x = clamp(p.x / L, 0., 1.);
  float hw = W * pow(sin(3.14159*x), shape) * (1. - 0.3*x);
  float d = max(abs(p.y) - hw, max(-p.x, p.x - L));

float spray(vec2 q, vec2 S, float a0, float curv, float len, float lsz, float seed, float w){

function skyCurve(ms) {

  for (let i = 0; i <= 144; i++) {
    const alt = SunMath.position(d.getTime() + i * 600000, cfg.lat, cfg.lon).altitude;
    path += (i ? 'L' : 'M') + (i / 144 * SKY_W).toFixed(1) + ' ' + altY(alt).toFixed(1);

function updateHUD(ms, st) {

  setText('date', fmtDate.format(new Date(ms)));
  const dt = st.dt;

  else if (ms < dt.sunrise) until = 'Sunrise in ' + duration(dt.sunrise - ms);

  skyCurve(ms);
  const x = frac(ms) * SKY_W, alt = st.pos.altitude, y = altY(alt);
  setAttr('doneRect', 'width', (x + 10).toFixed(1));
  setAttr('sun', 'cx', x.toFixed(1)); setAttr('sun', 'cy', y.toFixed(1));
  setAttr('halo', 'cx', x.toFixed(1)); setAttr('halo', 'cy', y.toFixed(1));
  $('sun').classList.toggle('below', alt < 0);

  setText('tSet', showTimes ? fmtTime.format(new Date(dt.sunset)) : '');
  if (showTimes) { setAttr('tRise', 'x', (frac(dt.sunrise) * SKY_W).toFixed(1)); setAttr('tSet', 'x', (frac(dt.sunset) * SKY_W).toFixed(1)); }

// ---------- loop ----------
const t0 = performance.now();
let lastHud = 0;
let hudOnBright = false, lastLuma = -1e9;
// Read back the rendered wall behind the time display so its text can flip dark/light.
// Must run right after drawing (the drawing buffer isn't preserved); a small, once-a-second read.
function measureBehindHUD() {
  const r = $('hud').getBoundingClientRect();
  if (!r.width) return;
  const k = canvas.width / innerWidth;
  const x = Math.max(0, Math.floor(r.left * k)), w = Math.min(canvas.width - x, Math.ceil(r.width * k));
  const y = Math.max(0, Math.floor(canvas.height - r.bottom * k)), h = Math.min(canvas.height - y, Math.ceil(r.height * k));
  if (w <= 0 || h <= 0) return;
  const px = new Uint8Array(w * h * 4);
  gl.readPixels(x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);

  for (let i = 0; i < px.length; i += 4 * 37) { sum += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; n++; }

}
let drawCount = 0;
function draw(force) {
  drawCount++;
  const now = simNow();
  const st = sunState(now);
  lastState = { now, st };
  if (hasGL) {
    const W = canvas.width, H = canvas.height;
    const anim = cfg.dynamic ? (performance.now() - t0) / 1000 + 20 : 20;
    // 1) wall: only when the surface or size changed
    if (wallDirty || !wallFB || wallFB.w !== W || wallFB.h !== H) {

      wallDirty = false;
    }

    const ls = cfg.lowPower ? 0.35 : LIGHT_SCALE;

    lightFB = target(lightFB, LW, LH);
    gl.bindFramebuffer(gl.FRAMEBUFFER, lightFB.fbo); gl.viewport(0, 0, LW, LH);
    const pl = use(lightProgram());
    u2(pl, 'uRes', LW, LH); u3(pl, 'uSun', st.s); u1(pl, 'uSunI', st.keyI);
    u1(pl, 'uScene', Math.max(0, SCENES.indexOf(cfg.scene))); u1(pl, 'uAnim', anim); u1(pl, 'uDyn', cfg.dynamic ? 1 : 0);
    u1(pl, 'uGust', gust());
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // 3) composite to the screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    const pc = use(P.comp);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, wallFB.tex); gl.uniform1i(u(pc, 'uWallTex'), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, lightFB.tex); gl.uniform1i(u(pc, 'uLightTex'), 1);
    u2(pc, 'uRes', W, H); u1(pc, 'uTime', (performance.now() - t0) / 1000);
    u3(pc, 'uSun', st.s); u3(pc, 'uSunCol', st.keyCol); u3(pc, 'uAmb', st.amb); u1(pc, 'uSunI', st.keyI);
    u1(pc, 'uNightGrade', st.night); u1(pc, 'uNight', st.nightI);
    u1(pc, 'uScene', Math.max(0, SCENES.indexOf(cfg.scene))); u1(pc, 'uRelief', RELIEF[cfg.wall] || 0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (cfg.showHUD && (force || performance.now() - lastLuma > 1000)) { measureBehindHUD(); lastLuma = performance.now(); }
  } else {   // no WebGL (never expected in WKWebView): flat wall tone
    const a = st.amb, t = v => Math.round(255 * Math.pow(1 - Math.exp(-v * 1.1), 1 / 2.2));
    document.body.style.background = `rgb(${t(a[0] + st.keyI * 0.3)},${t(a[1] + st.keyI * 0.27)},${t(a[2] + st.keyI * 0.22)})`;
  }
  const pn = performance.now();
  if (force || pn - lastHud > (cfg.speed !== 1 || cfg.timeOverride != null ? 66 : 1000)) { updateHUD(now, st); lastHud = pn; }

let lastState = null, drawQueued = false, loopTimer = 0;
// How often to redraw. Motion in the dynamic environment is slow and soft, so 20 fps is plenty;
// a still scene only needs the sun's slow drift, and a time preview needs smooth playback.
function frameInterval() {
  if (cfg.lowPower) return 10000;
  if (cfg.speed !== 1 || cfg.timeOverride != null) return 1000 / 30;
  if (!cfg.dynamic) return 5000;
  // match the frame rate to how much is actually moving: fluttering leaves need the most,
  // bare blinds or windows very little
  return 1000 / ({ foliage: 20, curtain: 15 }[cfg.decoration] || 12);
}
function loop() {

  if (document.hidden) { loopTimer = setTimeout(loop, 1000); return; }
  requestAnimationFrame(() => {
    const t = performance.now();
    draw(false);
    loopTimer = setTimeout(loop, Math.max(0, frameInterval() - (performance.now() - t)));

}
document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });

// ---------- public API ----------
window.lull = {
  _draws() { return drawCount; },
  // dev: average ms per full redraw (forces GPU sync each frame)
  _bench(n) {

  config: cfg,

// drag the timeline to scrub while previewing (in a browser; the desktop window is click-through)
(function () {
  const sky = $('sky');
  let dragging = false;
  function scrubTo(ev) {
    const r = sky.getBoundingClientRect();
    const f = clamp((ev.clientX - r.left) / r.width, 0, 0.99999);
    const d = new Date(simNow()); d.setHours(0, 0, 0, 0);

    draw(true);

  else if (e.key === 'w') { cfg.wall = WALLS[(WALLS.indexOf(cfg.wall) + 1) % WALLS.length]; wallDirty = true; draw(true); }

  else if (e.key === 'h') { cfg.showHUD = !cfg.showHUD; draw(true); }

if (cfg.timeOverride != null && !qs.has('speed')) cfg.speed = 0; // a fixed ?t= freezes time unless speed given
